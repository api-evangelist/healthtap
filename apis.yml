aid: healthtap
name: HealthTap
description: >-
  HealthTap is a United States virtual primary care medical group and telehealth
  technology company. It operates a nationwide network of board-certified,
  U.S.-licensed physicians covering all 50 states and Washington, D.C., and
  delivers video and phone visits for primary care, urgent care, chronic
  condition management and preventive care, plus 90-day follow-up text messaging
  with the treating doctor, prescription and lab ordering, and Dr. A.I. symptom
  triage. It sells direct to consumers on a monthly membership plus a per-visit
  fee, is in network with commercial and Medicare plans, and is deployed
  white-labeled or co-branded with employers, health plans, health systems and
  retailers. HealthTap previously operated a public developer platform,
  HealthTap Cloud (developers.healthtap.com, launched November 2016), which
  offered REST APIs and iOS/Android SDKs over its HOPES health operating system;
  that portal no longer resolves in DNS and HealthTap publishes no public API
  documentation, OpenAPI, GraphQL, AsyncAPI or MCP surface today. Partner data
  exchange runs through contracted integrations such as Commure and Health
  Gorilla. Sector: healthtech.
