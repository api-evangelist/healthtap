method: probed
source: live probes of www.healthtap.com, api.healthtap.com, api-us.healthtap.com,
  support.healthtap.com, docs.healthtap.com and developers.healthtap.com
notes: >-
  No /.well-known/ discovery documents are published on any HealthTap host. The
  healthtap.com Cloudflare zone (www, api, api-us, doctors, support in front of
  Zendesk) answers HTTP 403 with a ~5 KB HTML block page to every non-browser
  client — including plain curl, a Chrome/Safari user-agent string, Googlebot,
  bingbot, facebookexternalhit and Twitterbot user-agents — for every path
  probed, so no discovery document could be retrieved and none is advertised.
  The blanket 403 is a bot/edge block, not a per-path signal: identical status
  and body size are returned for /robots.txt and for every /.well-known/ path.
  support.healthtap.com serves a genuine 404 behind the block for /.well-known/*
  and a real 200 for /robots.txt (stock Zendesk Help Center robots).
  docs.healthtap.com is a bare nginx redirector that 301s every path to
  https://developers.healthtap.com/reference/ — a host that no longer resolves
  in DNS (see lifecycle/healthtap-lifecycle.yml).
